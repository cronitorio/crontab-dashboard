name: Dashboard release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: web/static/
  binaries:
    needs: web
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: linux, arch: arm}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: web/static
      - name: Build dashboard
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          RELEASE_TAG: ${{ github.ref_name }}
        run: go build -trimpath -ldflags "-s -w -X github.com/cronitorio/crontab-dashboard/internal/dashboard.Version=${RELEASE_TAG#v}" -o dist/crontab-dashboard .
      - run: ./scripts/package-release.sh '${{ matrix.os }}_${{ matrix.arch }}' dist/crontab-dashboard dist/assets
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/assets/*
  publish:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist/assets
          merge-multiple: true
      - name: Verify and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for target in linux_amd64 linux_arm64 linux_arm darwin_amd64 darwin_arm64; do
            archive="dist/assets/$target.tar.gz"
            test -s "$archive"
            printf '%s  %s\n' "$(cat "$archive.sha256")" "$archive" | sha256sum --check --strict
          done
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Crontab Guru Dashboard $RELEASE_TAG" --notes-file docs/releases/$RELEASE_TAG.md
          fi
          gh release upload "$RELEASE_TAG" dist/assets/* install.sh --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
