name: Dashboard tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run test:dependencies && npm run build
        working-directory: web
      - run: ./scripts/build-test-cli.sh
      - run: CRONTAB_DASHBOARD_TEST_CLI="$PWD/dist/cronitor-test" go test -race ./...
      - run: go vet ./...
      - run: go build -o dist/crontab-dashboard .
      - run: python3 scripts/test-install.py
      - run: python3 scripts/test-container-entrypoint.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t crontab-dashboard:test .
      - run: python3 scripts/test-container.py
